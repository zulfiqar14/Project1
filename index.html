<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101226">
  <title>Hello, world!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden;
      color: #f7f5ff; background: #101226;
      background-image: radial-gradient(ellipse at 20% 15%, #4e35a84d, transparent 40%), radial-gradient(ellipse at 85% 80%, #087e9c38, transparent 38%);
    }
    .orb { position: fixed; width: 19rem; aspect-ratio: 1; border-radius: 50%; filter: blur(70px); opacity: .28; pointer-events: none; animation: drift 12s ease-in-out infinite alternate; }
    .orb.one { background: #a855f7; top: -8rem; left: -5rem; }
    .orb.two { background: #22d3ee; right: -8rem; bottom: -9rem; animation-delay: -5s; }
    main { width: min(90vw, 760px); position: relative; padding: clamp(2rem, 7vw, 5.5rem); text-align: center; border: 1px solid #ffffff20; border-radius: 32px; background: linear-gradient(145deg, #ffffff0e, #ffffff05); box-shadow: 0 32px 100px #0006, inset 0 1px #ffffff18; backdrop-filter: blur(18px); }
    nav { position: fixed; z-index: 2; top: 1.5rem; left: 50%; display: flex; gap: .5rem; padding: .45rem; transform: translateX(-50%); border: 1px solid #ffffff20; border-radius: 999px; background: #101226b8; backdrop-filter: blur(14px); }
    nav a { padding: .65rem 1rem; border-radius: 999px; color: #c7c4dc; font-size: .9rem; text-decoration: none; transition: color .2s, background .2s; }
    nav a:hover, nav a:focus-visible { color: #fff; background: #ffffff14; }
    .eyebrow { display: inline-flex; align-items: center; gap: .55rem; padding: .55rem .85rem; border: 1px solid #ffffff22; border-radius: 999px; color: #c7c4dc; font-size: .76rem; letter-spacing: .14em; text-transform: uppercase; }
    .spark { color: #67e8f9; font-size: 1rem; }
    h1 { margin: 1.5rem 0 1rem; font-size: clamp(3.4rem, 10vw, 6.7rem); line-height: .98; letter-spacing: -.075em; font-weight: 800; }
    h1 span { color: transparent; background: linear-gradient(105deg, #fff 15%, #c4b5fd 52%, #67e8f9 95%); background-clip: text; -webkit-background-clip: text; }
    p { max-width: 32rem; margin: 0 auto; color: #b8b7cc; font-size: clamp(1rem, 2.5vw, 1.15rem); line-height: 1.75; }
    .rule { width: 3rem; height: 2px; margin: 2rem auto; border-radius: 9px; background: linear-gradient(90deg, #a78bfa, #67e8f9); }
    .footer { color: #85849d; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; }
    @keyframes drift { to { transform: translate(30px, 25px) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="orb one" aria-hidden="true"></div>
  <div class="orb two" aria-hidden="true"></div>
  <nav aria-label="Main navigation">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <div class="eyebrow"><span class="spark" aria-hidden="true">✦</span> A little something to start</div>
    <h1><span>Hello,<br>world!</span></h1>
    <p>A fresh page, a blank canvas, and a whole world of possibilities ahead. Here’s to making something wonderful.</p>
    <div class="rule" aria-hidden="true"></div>
    <div class="footer">Made with curiosity</div>
  </main>
</body>
</html>
